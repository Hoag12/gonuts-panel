<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="gonuts-csrf" content="{{CSRF}}">
<title>GoNuts dashboard</title>
<link rel="icon" href="/assets/logo.png">
<link rel="stylesheet" href="/assets/dashboard.css">
</head>
<body>
<header class="top">
  <h1>GoNuts <span>dashboard</span></h1>
  <div class="top-right">
    <button class="btn gold" id="linkClient">Link client</button>
    <span id="who" class="who"></span>
    <form method="post" action="/auth/logout">
      <input type="hidden" name="csrf" value="{{CSRF}}">
      <button class="btn ghost">Sign out</button>
    </form>
  </div>
</header>
<main>
  <section id="empty" class="empty panel" hidden>
    <h2>No clients linked yet</h2>
    <p>Choose <strong>Link client</strong>, then enter the code in GoNuts → Dashboard → Link with code.</p>
  </section>
  <section id="hiveOverview" class="hive-overview panel" hidden>
    <div class="hive-head">
      <div class="hive-title">
        <span class="label">Hive</span>
        <strong id="hiveName">—</strong>
      </div>
      <div class="hive-tools">
        <label class="control-select">
          <span class="label">Control</span>
          <select id="scope" aria-label="Control scope"></select>
        </label>
        <div class="seg" id="viewToggle" role="group" aria-label="View mode">
          <button type="button" data-view="split">Split</button>
          <button type="button" data-view="hive">Hive</button>
        </div>
        <button class="btn gold" id="openHivePanel">Open hive panel</button>
      </div>
    </div>
    <div class="hive-tiles">
      <div class="tile"><span class="label">Auction slots</span><b id="hiveSlots">—</b></div>
      <div class="tile"><span class="label">Bank</span><b id="hiveBank">—</b></div>
      <div class="tile"><span class="label">Trades</span><b id="hiveTrades">—</b></div>
      <div class="tile"><span class="label">Online</span><b id="hiveOnline">—</b></div>
    </div>
    <div class="hive-controls">
      <button class="btn" id="hivePause">Pause</button>
      <button class="btn" id="hiveResume">Resume</button>
      <button class="btn" id="hiveRefresh">Refresh</button>
      <span class="muted" id="hiveScopeNote"></span>
    </div>
    <div id="hiveStats" class="hive-stats"></div>
    <p class="hive-note muted" id="hiveNote"></p>
  </section>
  <section id="cards" class="cards" aria-live="polite"></section>
</main>
<div id="modal" class="modal" hidden>
  <div class="modal-card panel">
    <h2>Link a client</h2>
    <p>Enter this one-use code in the intended bot within five minutes.</p>
    <div class="code" id="code">…</div>
    <p class="muted" id="codeExpiry"></p>
    <div class="modal-actions">
      <button class="btn" id="copyCode">Copy code</button>
      <button class="btn ghost" id="closeModal">Close</button>
    </div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
<script src="/assets/dashboard.js"></script>
</body>
</html>
